# Run everything: docker compose up
# Brings up the MCP server and n8n together, on a shared network, so n8n can
# reach the MCP server at http://mcp-server:8000/mcp (not localhost — that
# only works from the host machine, not from inside another container).
#
# Env vars: set these in a .env file in this folder (git-ignored, never commit
# real tokens). See README.md for what each one is.

services:
  mcp-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      - USE_MOCK_CLAUDE=${USE_MOCK_CLAUDE:-true}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_AUTH_MODE=${JIRA_AUTH_MODE:-token}
      - JIRA_PAT=${JIRA_PAT:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - USE_FAKE_JIRA=${USE_FAKE_JIRA:-true}
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=8000
      - WEBHOOK_URL=http://52.55.106.169:5678/
      - N8N_SECURE_COOKIE=false
    networks:
      - compliance-net

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      # WEBHOOK_URL must be an address Jira can actually reach — localhost
      # only works for testing from the same machine. For a real webhook
      # from Jira, this needs to be a real reachable URL (MIP-hosted domain,
      # or a tunnel like ngrok for local testing).
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - compliance-net
    depends_on:
      - mcp-server

networks:
  compliance-net:

volumes:
  n8n_data:
